<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vandin Contact Manager</title>

    <link rel="stylesheet" href="styles.css" />    
    <link rel="stylesheet" href="css/blog.css" />
    <script src="header.js"></script>
  </head>
  <body>
    <div id="header"></div>


<main class="blog-container blog-page">

    <!-- Search -->

    <section class="search-section">
        <input
                type="text"
                id="searchInput"
                placeholder="Search articles..."
        >
    </section>

    <!-- Tags -->

    <section id="tagContainer" class="tag-container">
        <!-- Generated dynamically -->
    </section>

    <!-- Blog Grid -->

    <section
            id="blogGrid"
            class="blog-grid">
    </section>

    <!-- Pagination -->

    <section
            id="pagination"
            class="pagination">
    </section>

</main>

<script src="js/blog-list.js"></script>

</body>
</html>
