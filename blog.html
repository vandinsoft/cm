<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <link rel="stylesheet" href="css/blog.css">
</head>

<body>

<header class="blog-header">
    <h1>Blog</h1>
    <p>Articles, tutorials and product updates.</p>
</header>

<main class="blog-container">

    <!-- Search -->

    <section class="search-section">
        <input
                type="text"
                id="searchInput"
                placeholder="Search articles..."
        >
    </section>

    <!-- Tags -->

    <section id="tagContainer" class="tag-container">
        <!-- Generated dynamically -->
    </section>

    <!-- Featured Post -->

    <section id="featuredPost" class="featured-post">
        <!-- Generated dynamically -->
    </section>

    <!-- Blog Grid -->

    <section
            id="blogGrid"
            class="blog-grid">
    </section>

    <!-- Pagination -->

    <section
            id="pagination"
            class="pagination">
    </section>

</main>

<script src="js/blog-list.js"></script>

</body>
</html>
