<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vandin Contact Manager</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">
          <img
            src="images/ContactManager.png"
            alt="Vandin Contact Manager"
            class="logo-icon"
          />

          <span>Vandin Contact Manager</span>
        </a>
        <div class="nav-links">
          <a href="AboutUs.html">About Us</a>
          <a href="Installation-kit.html">Installation Kit</a>
          <a href="index.html#contact">Contact Us</a>
        </div>
      </nav>
    </header>

    <section class="pdf-page">
      <!--h1 class="pdf-title">About Us</h1-->

      <div class="pdf-container">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </section>

    <script type="module">
      import * as pdfjsLib from "./pdfjs/build/pdf.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs/build/pdf.worker.mjs";

      let pdfDoc = null;
      let currentPage = 1;

      const canvas = document.getElementById("pdf-canvas");

      const ctx = canvas.getContext("2d");

      async function renderPage(pageNumber) {
        const page = await pdfDoc.getPage(pageNumber);

        const containerWidth =
          document.querySelector(".pdf-container").clientWidth - 40;

        const viewport = page.getViewport({ scale: 1 });

        const scale = containerWidth / viewport.width;

        const scaledViewport = page.getViewport({ scale });

        canvas.width = scaledViewport.width;

        canvas.height = scaledViewport.height;

        await page.render({
          canvasContext: ctx,
          viewport: scaledViewport,
        }).promise;
      }

      const loadingTask = pdfjsLib.getDocument({
        url: "./AboutUs.pdf",
      });

      loadingTask.promise
        .then(async (pdf) => {
          pdfDoc = pdf;

          await renderPage(currentPage);
        })
        .catch((error) => {
          console.error("PDF loading error:", error);
        });

      window.addEventListener("resize", () => {
        if (pdfDoc) {
          renderPage(currentPage);
        }
      });
    </script>
  </body>
</html>
