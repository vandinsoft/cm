<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - VANDIN Contact Manager</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .gallery-page {
            max-width: 1400px;
            margin: auto;
            padding: 40px 20px;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-grid {
            columns: 4 300px;
            column-gap: 20px;
        }

        .gallery-card {
            break-inside: avoid;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform .25s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
        }

        .gallery-card img {
            width: 100%;
            display: block;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            padding: 30px;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 12px;
        }

        .lightbox.open {
            display: flex;
        }
    </style>

    <script src="header.js"></script>
</head>
<body>

<div id="header"></div>

<div class="gallery-page">

    <div class="gallery-title">
        <h1>Application Gallery</h1>
        <p>Explore VANDIN Contact Manager screenshots</p>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>

</div>

<div id="lightbox" class="lightbox">
    <img id="lightboxImage">
</div>

<script>
    const images = [];

    // Creates gallery/01.png through gallery/20.png
    for (let i = 2; i <= 41; i++) {
        images.push(`gallery/${String(i).padStart(2, "0")}.png`);
    }

    const gallery = document.getElementById("galleryGrid");

    images.forEach(path => {

        const card = document.createElement("div");
        card.className = "gallery-card";

        const img = document.createElement("img");
        img.src = path;
        img.loading = "lazy";

        img.onclick = () => {
            document.getElementById("lightboxImage").src = path;
            document.getElementById("lightbox").classList.add("open");
        };

        card.appendChild(img);
        gallery.appendChild(card);
    });

    document.getElementById("lightbox").onclick = () => {
        document.getElementById("lightbox").classList.remove("open");
    };
</script>

</body>
</html>
